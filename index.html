<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Hụi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF3E7; --paper-line:#CFE0C6; --rule:#6F8F63; --ink:#24261F; --ink-soft:#5B6152;
    --red:#A63D2F; --blue:#2B4C6F; --gold:#D9A441; --gold-soft:#F3DFAE; --card:#F7FAF2;
    --heart:#C2637A; --heart-soft:#F7E3E8;
    --shadow: 0 1px 0 rgba(111,143,99,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 28px), var(--paper);
    font-family:'Inter',sans-serif; color:var(--ink); padding-bottom:60px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px;}
  .app-shell{display:flex;gap:26px;max-width:1400px;width:94%;margin:0 auto;align-items:flex-start;padding:0 12px;}
  .main-col{flex:1;min-width:0;}
  .main-col .wrap{margin:0;padding:18px 0 40px;max-width:none;}
  .side-col{width:270px;flex-shrink:0;position:sticky;top:18px;padding-top:18px;}
  .note-panel{background:var(--card);border:1px solid var(--paper-line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .note-panel h3{font-family:'Source Serif 4',serif;font-size:15px;margin:0 0 10px;color:var(--heart);}
  .note-item{border-bottom:1px dashed var(--paper-line);padding:8px 0;}
  .note-item:last-child{border-bottom:none;}
  .note-toggle{cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:12.5px;}
  .note-toggle .preview{font-weight:600;color:var(--ink);word-break:break-word;}
  .note-toggle .arrow{color:var(--blue);flex-shrink:0;}
  .note-item textarea{width:100%;margin-top:6px;min-height:70px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:6px;font-family:'Inter',sans-serif;font-size:12.5px;resize:vertical;background:#fff;color:var(--ink);}
  .note-item .note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:5px;}
  .note-item .note-date{font-size:10px;color:var(--ink-soft);}
  .note-icon-btn{background:none;border:1px solid var(--paper-line);border-radius:5px;cursor:pointer;font-size:13px;padding:3px 7px;line-height:1;}
  .note-icon-btn:hover{background:var(--paper);}
  @media (max-width: 900px){
    .app-shell{flex-direction:column;padding:0;}
    .side-col{width:100%;position:static;padding-top:0;}
    .main-col{width:100%;}
  }
  .masthead{display:flex;align-items:center;gap:14px;padding:8px 4px 16px;border-bottom:2px solid var(--rule);margin-bottom:14px;}
  .stamp-deco{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--heart);display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-9deg);color:var(--heart);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px;text-align:center;line-height:1.15;opacity:0.9;background:var(--heart-soft);}
  .masthead h1{font-family:'Source Serif 4',serif;font-size:26px;margin:0;letter-spacing:0.5px;}
  .masthead p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}

  .tabnav{display:flex;gap:5px;margin-bottom:16px;}
  .tabnav button{flex:1;padding:10px 4px;border:1px solid var(--paper-line);background:var(--card);border-radius:8px 8px 0 0;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;}
  .tabnav button.active{color:var(--ink);border-bottom:3px solid var(--rule);background:#fff;}

  .hero{background:linear-gradient(180deg,var(--gold-soft),#EFD187);border:1px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .hero .label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7A5A16;font-weight:600;}
  .hero .amount{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:32px;color:var(--red);margin:4px 0;}
  .hero .sub{font-size:12.5px;color:#7A5A16;}
  .hero .sub2{font-size:12px;color:#7A5A16;margin-top:2px;}

  .add-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer;margin-bottom:14px;font-family:'Inter',sans-serif;}
  .back-btn{background:none;border:none;color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0;margin-bottom:12px;}

  .form-panel{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:16px;margin-bottom:18px;display:none;}
  .form-panel.open{display:block;}
  .form-panel h3{margin:0 0 10px;font-family:'Source Serif 4',serif;font-size:17px;}
  .field-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:120px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);}
  .field input:disabled{background:#F0F0EA;color:var(--ink-soft);}
  .form-actions{display:flex;gap:8px;margin-top:4px;}
  .btn-primary{background:var(--rule);color:#fff;border:none;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:13.5px;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--paper-line);border-radius:6px;padding:10px 16px;cursor:pointer;font-size:13.5px;}
  .preview-box{background:#fff;border:1px dashed var(--gold);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:10px;color:#7A5A16;}
  .preview-box b{font-family:'IBM Plex Mono',monospace;}

  /* List rows */
  .row-card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row-card.done{opacity:0.55;}
  .row-card .left{flex:1;min-width:0;}
  .row-card .name{font-family:'Source Serif 4',serif;font-weight:700;font-size:15.5px;}
  .row-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .row-card .right{text-align:right;flex-shrink:0;}
  .row-card .amt{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;}
  .row-card .amt.unpaid{color:var(--red);}
  .row-card .amt.paid{color:var(--rule);}
  .chev{color:var(--ink-soft);margin-left:6px;}

  .pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#E4ECDD;color:var(--rule);margin-left:6px;vertical-align:middle;}
  .pill.warn{background:var(--gold-soft);color:#7A5A16;}
  .stamp{display:inline-flex;align-items:center;justify-content:center;border:2px solid;border-radius:8px;padding:2px 9px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;letter-spacing:1px;transform:rotate(-4deg);}
  .stamp.song{color:var(--blue);border-color:var(--blue);}
  .stamp.chet{color:var(--red);border-color:var(--red);}

  /* Detail / cards */
  .detail-card{background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .detail-card.finalky{border-color:var(--gold);border-width:2px;}
  .detail-card.closed{opacity:0.6;}
  .detail-title{font-family:'Source Serif 4',serif;font-weight:700;font-size:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-title{font-family:'Source Serif 4',serif;font-weight:700;font-size:17px;}
  .grid-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .info-box{background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:7px 9px;}
  .info-box .k{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
  .info-box .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;margin-top:2px;}
  .edit-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .edit-row .field{min-width:90px;}
  .edit-row .field input, .edit-row .field select{padding:7px 8px;font-size:13px;}
  .final-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#7A5A16;background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:7px 9px;margin-bottom:10px;flex-wrap:wrap;}
  .final-toggle input[type=checkbox]{accent-color:var(--gold);}
  .pay-line{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--paper-line);padding-top:10px;}
  .pay-amount{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;}
  .pay-amount.unpaid{color:var(--red);}
  .pay-amount.paid{color:var(--rule);}
  .pay-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .act-btn{flex:1;min-width:110px;padding:9px 8px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .act-btn.mark-paid{background:var(--rule);color:#fff;border-color:var(--rule);}
  .act-btn.mark-paid.is-paid{background:#fff;color:var(--rule);}
  .act-btn.next-ky{background:var(--blue);color:#fff;border-color:var(--blue);}
  .act-btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .act-btn.danger{color:var(--red);border-color:var(--red);}
  .finished-badge{font-size:11.5px;font-weight:700;color:#7A5A16;background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:6px 9px;text-align:center;margin-top:8px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:38px;margin-bottom:8px;}
  .empty p{font-size:13.5px;line-height:1.5;}

  /* Stats tables */
  .stats-section{margin-bottom:22px;}
  .stats-section h3{font-family:'Source Serif 4',serif;font-size:16px;margin:0 0 4px;border-bottom:2px solid var(--rule);padding-bottom:6px;}
  .stats-section .grp-meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .table-wrap{overflow-x:auto;margin-bottom:10px;border-radius:8px;border:1px solid var(--paper-line);}
  table.stat-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;min-width:560px;}
  table.stat-table th{background:#E4ECDD;color:var(--ink);font-size:10px;text-transform:uppercase;letter-spacing:0.3px;padding:7px 6px;border-bottom:1px solid var(--paper-line);white-space:nowrap;}
  table.stat-table td{padding:7px 6px;border-bottom:1px solid var(--paper-line);text-align:center;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  table.stat-table td.left{text-align:left;font-family:'Inter',sans-serif;font-weight:600;}
  table.stat-table tr.total-row td{background:var(--gold-soft);font-weight:700;}
  table.stat-table td.red{color:var(--red);font-weight:700;}
  table.stat-table td.blue{color:var(--blue);font-weight:700;}
  table.stat-table td.green{color:var(--rule);font-weight:700;}
  table.stat-table tbody tr:last-child td{border-bottom:none;}

  .note-box{font-size:11.5px;color:var(--ink-soft);background:#fff;border:1px dashed var(--paper-line);border-radius:6px;padding:8px 9px;margin-bottom:12px;line-height:1.45;}

  footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:24px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="authGate" style="display:none;">
  <div class="wrap" style="max-width:380px;padding-top:60px;">
    <div class="masthead" style="justify-content:center;text-align:center;flex-direction:column;border-bottom:none;">
      <div class="stamp-deco">♡</div>
      <div><h1>Sổ Hụi</h1><p>Đăng nhập để xem sổ của vợ 💛</p></div>
    </div>
    <div class="form-panel open">
      <h3>Đăng nhập</h3>
      <div class="field-row"><div class="field"><label>Email</label><input type="email" id="auth_email" placeholder="email@vidu.com"></div></div>
      <div class="field-row"><div class="field"><label>Mật khẩu</label><input type="password" id="auth_password" placeholder="••••••••"></div></div>
      <div class="form-actions"><button class="btn-primary" id="authLoginBtn" style="width:100%;">Đăng nhập</button></div>
      <div id="authError" style="color:var(--red);font-size:12.5px;margin-top:10px;display:none;"></div>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<div class="app-shell">
  <div class="main-col">
    <div class="wrap">
      <div class="masthead">
        <div class="stamp-deco">♡</div>
        <div style="flex:1;"><h1>Sổ Hụi</h1><p>Sổ hụi của vợ — vốn liếng vợ giữ, lời lãi vợ ăn,<br>chồng chỉ lo code 💛</p></div>
        <button class="btn-ghost" id="authLogoutBtn" style="flex:0 0 auto;font-size:12px;padding:7px 10px;">Đăng xuất</button>
      </div>

      <div class="tabnav">
        <button data-tab="list" id="tabBtnList">Thu theo ngày</button>
        <button data-tab="tran" id="tabBtnTran">Tràn hụi</button>
        <button data-tab="stats" id="tabBtnStats">Thống kê</button>
      </div>

      <div id="tabList"></div>
      <div id="tabTran" style="display:none"></div>
      <div id="tabStats" style="display:none"></div>

      <footer>Dữ liệu lưu riêng cho vợ yêu trên thiết bị này · Sổ Hụi 💛 made with love</footer>
    </div>
  </div>
  <div class="side-col">
    <div class="note-panel">
      <h3>📝 Ghi chú</h3>
      <button class="add-btn" id="addGhiChuBtn" style="padding:9px;font-size:13px;margin-bottom:10px;">+ Ghi chú mới</button>
      <div id="ghiChuList"></div>
    </div>
  </div>
</div>
</div>

<script>
/* ===================== HELPERS ===================== */
const fmt = n => (Math.round(n)||0).toLocaleString('vi-VN') + ' đ';
function toLocalISODate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
const todayISO = () => toLocalISODate(new Date());
const monthKey = iso => iso.slice(0,7);
const monthLabel = mk => { const [y,m] = mk.split('-'); return `Th ${Number(m)}/${y}`; };
const loaiLabel = { ngay:'Ngày', tuan:'Tuần', thang:'Tháng', nam:'Năm', khac:'Khác', '10ngay':'10 ngày' };
const tongKyFieldLabel = loai => loai==='ngay' ? 'Số ngày (VD: 25, 30, 32)' : loai==='tuan' ? 'Số tuần (VD: 12, 19)' : loai==='nam' ? 'Số năm' : loai==='khac' ? 'Số chu kỳ' : 'Số tháng (VD: 10, 12)';
const tranKySuggest = loai => loai==='ngay' ? [25,30,32] : loai==='tuan' ? [12,19] : loai==='nam' ? [3,5] : loai==='khac' ? [10,20,30] : [10,12];
const uid = () => crypto.randomUUID();
function formatDateVN(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function calcNgayDong(d){
  if(!d.ngayKhui) return null;
  const idx = Math.max(d.kyHienTai - 1, 0);
  return addPeriods(d.ngayKhui, d.loai, idx);
}
function addPeriods(dateISO, loai, count, customDays){
  if(!dateISO) return null;
  const due = new Date(dateISO+'T00:00:00');
  if(loai === 'ngay') due.setDate(due.getDate() + count);
  else if(loai === 'tuan') due.setDate(due.getDate() + count*7);
  else if(loai === 'nam') due.setFullYear(due.getFullYear() + count);
  else if(loai === 'khac') due.setDate(due.getDate() + count*(customDays||1));
  else due.setMonth(due.getMonth() + count);
  return toLocalISODate(due);
}
function currentMonthRange(){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
  return { from: toLocalISODate(first), to: toLocalISODate(last) };
}

/* ===================== HỘP THOẠI TỰ VẼ (thay cho confirm/prompt/alert gốc) ===================== */
function closeOverlay(ov){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }
function makeOverlay(innerHTML){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(36,38,31,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  ov.innerHTML = `<div style="background:#fff;border-radius:10px;padding:18px;max-width:340px;width:100%;font-family:'Inter',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,0.25);">${innerHTML}</div>`;
  document.body.appendChild(ov);
  return ov;
}
function customAlert(message){
  const ov = makeOverlay(`
    <div style="font-size:13.5px;color:var(--ink);margin-bottom:14px;line-height:1.5;white-space:pre-line;">${message}</div>
    <button id="caOk" style="width:100%;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Đã hiểu</button>`);
  ov.querySelector('#caOk').onclick = () => closeOverlay(ov);
}
function customConfirm(message, onYes){
  const ov = makeOverlay(`
    <div style="font-size:13.5px;color:var(--ink);margin-bottom:14px;line-height:1.5;white-space:pre-line;">${message}</div>
    <div style="display:flex;gap:8px;">
      <button id="ccYes" style="flex:1;background:var(--red);color:#fff;border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Xác nhận</button>
      <button id="ccNo" style="flex:1;background:#F0F0EA;color:var(--ink);border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Huỷ</button>
    </div>`);
  ov.querySelector('#ccYes').onclick = () => { closeOverlay(ov); onYes(); };
  ov.querySelector('#ccNo').onclick = () => closeOverlay(ov);
}
function customPrompt(message, defaultValue, onSubmit){
  const ov = makeOverlay(`
    <div style="font-size:12.5px;color:var(--ink);margin-bottom:10px;line-height:1.5;white-space:pre-line;">${message}</div>
    <input type="number" id="cpInput" value="${defaultValue}" style="width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;">
    <div style="display:flex;gap:8px;">
      <button id="cpYes" style="flex:1;background:var(--rule);color:#fff;border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Xác nhận</button>
      <button id="cpNo" style="flex:1;background:#F0F0EA;color:var(--ink);border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Huỷ</button>
    </div>`);
  const inp = ov.querySelector('#cpInput');
  inp.focus(); inp.select();
  ov.querySelector('#cpYes').onclick = () => { const v = Number(inp.value)||0; closeOverlay(ov); onSubmit(v); };
  ov.querySelector('#cpNo').onclick = () => closeOverlay(ov);
}
// Hộp thoại chi tiết khi hốt giữa chừng (chưa tới kỳ cuối):
// Sống = (kỳ hiện tại - 1) đóng đủ mệnh giá; Chết = (tổng kỳ - kỳ hiện tại + 1) được trừ thăm kêu tại kỳ hốt.
function customHotGiuaChung(t, onConfirm){
  const K = t.kyHienTai;
  const tongLoiDaThu = (t.lichSuLoi||[]).reduce((s,l)=>s+l.thamKeu,0);
  const song = Math.max(K-1, 0);
  const chet = Math.max(t.tongSoKy - K + 1, 0);
  const ov = makeOverlay(`
    <div style="font-size:13.5px;color:var(--ink);margin-bottom:10px;font-weight:700;font-family:'Source Serif 4',serif;">Hốt giữa chừng — kỳ ${K}/${t.tongSoKy}</div>
    <div class="field" style="margin-bottom:10px;">
      <label style="display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;">Thăm kêu tại kỳ ${K} (đ)</label>
      <input type="number" id="hgcThamKeu" value="${t.thamKeuKyNay||0}" style="width:100%;padding:9px 10px;border:1px solid var(--paper-line);border-radius:6px;font-size:14px;font-family:'IBM Plex Mono',monospace;">
    </div>
    <div class="preview-box" id="hgcPreview" style="margin-bottom:12px;font-size:12px;line-height:1.6;"></div>
    <div style="display:flex;gap:8px;">
      <button id="hgcYes" style="flex:1;background:var(--rule);color:#fff;border:none;border-radius:6px;padding:10px;font-weight:600;cursor:pointer;">Xác nhận Hốt</button>

  };
  ov.querySelector('#hgcNo').onclick = () => closeOverlay(ov);
}

/* ===================== GHI DB — RETRY TỰ ĐỘNG, TỪNG RECORD RIÊNG ===================== */
let dbFailCount = 0;
let dbRetryTimer = null;
function dbWrite(promiseFactory, label){
  promiseFactory().then(({error}) => {
    if(error) throw error;
    dbFailCount = 0;
    if(dbRetryTimer){ clearTimeout(dbRetryTimer); dbRetryTimer = null; }
  }).catch(e => {
    console.error('Lỗi lưu '+label, e);
    dbFailCount++;
    if(dbRetryTimer) clearTimeout(dbRetryTimer);
    if(dbFailCount <= 3){
      const delay = dbFailCount===1 ? 2000 : dbFailCount===2 ? 5000 : 10000;
      dbRetryTimer = setTimeout(() => dbWrite(promiseFactory, label), delay);
    } else {
      customAlert(`Không lưu được "${label}" lên hệ thống trong ít phút qua (lỗi tạm thời).\n\nDữ liệu vẫn đang hiển thị trên màn hình — đừng đóng trang này. App sẽ tiếp tục tự thử lưu lại.`);
      dbFailCount = 0;
      dbRetryTimer = setTimeout(() => dbWrite(promiseFactory, label), 15000);
    }
  });
}

async function loadData(){
  try{
    const [linesRes, paymentsRes, dealsRes, loiRes, thuRes, ghiChuRes] = await Promise.all([
      supa.from('hui_lines').select('*'),
      supa.from('hui_payments').select('*'),
      supa.from('tran_deals').select('*'),
      supa.from('tran_loi_history').select('*'),
      supa.from('thu_ngay').select('*'),
      supa.from('ghi_chu').select('*'),
    ]);
    if(linesRes.error) throw linesRes.error;
    if(paymentsRes.error) throw paymentsRes.error;
    if(dealsRes.error) throw dealsRes.error;
    if(loiRes.error) throw loiRes.error;
    if(thuRes.error) throw thuRes.error;
    if(ghiChuRes.error) throw ghiChuRes.error;

    state.dayList = (linesRes.data||[]).map(rowToHuiLine);
    state.payments = (paymentsRes.data||[]).map(rowToPayment);
    const deals = (dealsRes.data||[]).map(rowToTranDeal);
    (loiRes.data||[]).forEach(r => {
      const deal = deals.find(t=>t.id===r.tran_deal_id);
      if(deal) deal.lichSuLoi.push(rowToLoi(r));
    });
    // Tự sửa nếu "kỳ hiện tại" bị lệch (do lưu server nửa chừng): lịch sử đã có kỳ nào
    // thì kỳ hiện tại phải lớn hơn kỳ đó ít nhất 1.
    deals.forEach(deal => {
      const maxKyDaThu = (deal.lichSuLoi||[]).reduce((m,l)=>Math.max(m,l.ky),0);
      const kyDung = Math.min(maxKyDaThu + 1, deal.tongSoKy);
      if(maxKyDaThu > 0 && kyDung > deal.kyHienTai){
        console.warn(`Tự sửa kỳ hiện tại của "${deal.ten}": ${deal.kyHienTai} → ${kyDung}`);
        deal.kyHienTai = kyDung;
        saveTranDeal(deal);
      }
    });
    state.tran = { deals };
    state.thu = { entries: (thuRes.data||[]).map(rowToThu) };
    state.ghiChu = { notes: (ghiChuRes.data||[]).map(rowToGhiChu) };
  }catch(e){ console.error('Lỗi tải dữ liệu', e); }
  if(!state.dayList) state.dayList = [];
  if(!state.payments) state.payments = [];
  if(!state.tran) state.tran = {deals:[]};
  if(!state.tran.deals) state.tran.deals = [];
  if(!state.thu) state.thu = {entries:[]};
  if(!state.thu.entries) state.thu.entries = [];
  if(!state.ghiChu) state.ghiChu = {notes:[]};
  if(!state.ghiChu.notes) state.ghiChu.notes = [];
  loaded = true;
  renderAll();
  renderGhiChu();
}

/* ===================== CALC — DÂY HỤI (hội viên) ===================== */
function tienDongChan(d){
  const soChan = d.soChan || 1;
  let donGia = d.trangThai === 'chet' ? d.menhGia : (d.menhGia - (d.boTham||0));
  if(donGia < 0) donGia = 0;
  let total = donGia * soChan;
  if(d.thuVonKyNay && d.trangThai === 'song') total += (d.soVon||0) * soChan;
  return total;
}
function daDongKyNay(d){ return state.payments.some(p => p.dayId===d.id && p.ky===d.kyHienTai); }
function daKetThuc(d){ return d.kyHienTai > d.tongSoKy || (d.kyHienTai === d.tongSoKy && daDongKyNay(d)); }

          <span style="color:var(--blue);font-weight:600;white-space:nowrap;">${expanded?'▲ Thu gọn':'▼ Xem'}</span>
        </div>
        ${expanded ? table : ''}
      </div>`;
    });
    html += `<div class="table-wrap"><table class="stat-table">
      <tbody><tr class="total-row"><td colspan="3" class="left">TỔNG CỘNG TẤT CẢ</td><td>${fmt(tongLoi)}</td><td class="green">${fmt(tongHoaHong)}</td><td>${fmt(tongTatCa)}</td></tr></tbody>
    </table></div>`;
  }
  return html;
}

      const newPayment = {id:uid(), dayId:d.id, ky:d.kyHienTai, soTien:tienDongChan(d), loi, ngay:todayISO()};
      state.payments.push(newPayment);
      savePaymentRemote(newPayment);

    saveHuiLine(d); renderDetail();
  };

/* ===================== TRÀN HỤI ===================== */
// Vốn ứng ra lúc tràn = phần sống (đã qua, đóng đủ mệnh giá) + phần chết (kỳ tràn + các kỳ còn lại, được trừ thăm kêu lúc tràn)
function vonUngRaTinh(soPhanChet, soPhanSong, menhGia, thamKeuLucTran){
  const donGiaChet = Math.max(menhGia - (thamKeuLucTran||0), 0);
  return soPhanSong*menhGia + soPhanChet*donGiaChet;
}
function tinhSongChetLucTran(tongSoKy, kyTran){
  const song = Math.max(kyTran - 1, 0);
  const chet = Math.max(tongSoKy - kyTran + 1, 0);
  return { song, chet };
}
function tranActive(){ return state.tran.deals.filter(t=>!t.daHot); }
function tranClosed(){ return state.tran.deals.filter(t=>t.daHot); }
// Ngày đến hạn của kỳ hiện tại = ngày mở hụi (kỳ 1) + (kỳ hiện tại - 1) chu kỳ
function tranDueDate(t){
  return addPeriods(t.ngayMoHui||t.ngayTran, t.loai, Math.max(t.kyHienTai - 1, 0), t.chuKyNgay);
}

      <table class="stat-table">
        <thead><tr><th>Kỳ</th><th>Thăm kêu</th>${t.an?'<th>Hoa hồng</th>':''}<th>Ngày</th><th>Ghi chú</th><th></th></tr></thead>
        <tbody>${lichSuRows}</tbody>
      </table>
    </div>` : ''}
  </div>`;
}

    <div class="detail-title" style="font-size:15px;"><span>${t.ten}<span class="pill">${loaiLabel[t.loai]||''}</span></span><button class="act-btn danger" style="flex:0 0 auto;padding:6px 10px;" data-action="xoa">Xoá</button></div>
    <div class="grid-info">
      <div class="info-box"><div class="k">Vốn đã ứng</div><div class="v">${fmt(t.vonUngRa)}</div></div>

    <div class="pay-line"><div><div class="pay-label">Lãi ròng vụ này</div><div class="pay-amount" style="color:var(--rule);">${fmt(t.laiRongKhiHot||0)}</div></div></div>

function renderTran(){
  document.getElementById('tabTran').innerHTML = tranHTML();

  document.querySelectorAll('.tran-toggle-row').forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.id;
      state.tranExpanded[id] = !state.tranExpanded[id];
      renderTran();
    };
  });

  document.getElementById('t_an').onchange = (e) => {
    document.getElementById('t_hoahong_row').style.display = e.target.checked ? 'flex' : 'none';
  };

  const updateKySuggestTran = () => {
    const loai = document.getElementById('t_loai').value;
    document.getElementById('t_ky-suggest').innerHTML = tranKySuggest(loai).map(o=>`<option value="${o}">`).join('');
    document.getElementById('t_tongkyLabel').textContent = tongKyFieldLabel(loai);
    document.getElementById('t_chukyngay_row').style.display = loai==='khac' ? 'flex' : 'none';
  };
  updateKySuggestTran();
  document.getElementById('t_loai').onchange = () => { updateKySuggestTran(); updatePreview(); };

  const updatePreview = () => {
    const menhgia = Number(document.getElementById('t_menhgia').value)||0;
    const thamkeu = Number(document.getElementById('t_thamkeutran').value)||0;
    const tongky = Number(document.getElementById('t_tongky').value)||0;
    const kytran = Number(document.getElementById('t_kytran').value)||0;
    const loai = document.getElementById('t_loai').value;
    const chukyngay = Number(document.getElementById('t_chukyngay').value)||1;
    const ngaymohui = document.getElementById('t_ngaymohui').value;
    const {song, chet} = tinhSongChetLucTran(tongky, kytran);
    const von = vonUngRaTinh(chet, song, menhgia, thamkeu);
    const soKyConLai = Math.max(tongky - 1, 0);
    const ngayKetThuc = addPeriods(ngaymohui, loai, soKyConLai, chukyngay);
    document.getElementById('t_ngayketthuc').value = ngayKetThuc || '';
    document.getElementById('t_ngayketthuc_view').value = ngayKetThuc ? formatDateVN(ngayKetThuc) : '—';
    document.getElementById('t_preview').innerHTML = `Lúc tràn: <b>${song} phần sống</b>, <b>${chet} phần chết</b> (tự tính: sống = kỳ tràn − 1, chết = tổng kỳ − kỳ tràn + 1)<br>Vốn cần ứng ra: <b>${fmt(von)}</b> (sống ${song}×${fmt(menhgia)} + chết ${chet}×${fmt(Math.max(menhgia-thamkeu,0))})`;
  };
  ['t_menhgia','t_thamkeutran','t_tongky','t_kytran','t_ngaytran','t_ngaymohui','t_chukyngay'].forEach(id=>{
    document.getElementById(id).oninput = updatePreview;
  });
  document.getElementById('t_ngaytran').onchange = updatePreview;
  document.getElementById('t_ngaymohui').onchange = updatePreview;
  updatePreview();

  document.getElementById('tranToggleFormBtn').onclick = () => document.getElementById('tranFormPanel').classList.toggle('open');
  document.getElementById('tranCancelBtn').onclick = () => document.getElementById('tranFormPanel').classList.remove('open');
  document.getElementById('tranSaveBtn').onclick = () => {
    const ten = document.getElementById('t_ten').value.trim();
    const loai = document.getElementById('t_loai').value;
    const menhgia = Number(document.getElementById('t_menhgia').value)||0;
    const tongky = Number(document.getElementById('t_tongky').value)||0;
    const kytran = Number(document.getElementById('t_kytran').value)||0;
    const thamkeutran = Number(document.getElementById('t_thamkeutran').value)||0;
    const ngaytran = document.getElementById('t_ngaytran').value || todayISO();
    const ngaymohui = document.getElementById('t_ngaymohui').value || ngaytran;
    const ngayketthuc = document.getElementById('t_ngayketthuc').value || null;
    const an = document.getElementById('t_an').checked;
    const hoaHong = Number(document.getElementById('t_hoahong').value)||0;
    const chuKyNgay = loai==='khac' ? (Number(document.getElementById('t_chukyngay').value)||10) : null;
    if(!ten || !menhgia || !tongky || !kytran){ customAlert('Vui lòng nhập đủ Tên, Mệnh giá, Tổng số kỳ, Kỳ tràn.'); return; }
    const {song, chet} = tinhSongChetLucTran(tongky, kytran);
    const vonUngRa = vonUngRaTinh(chet, song, menhgia, thamkeutran);
    state.tran.deals.push({
      id: uid(), ten, loai, menhGia: menhgia, tongSoKy: tongky, kyTran: kytran,
      soPhanChetLucTran: chet, soPhanSongLucTran: song, thamKeuLucTran: thamkeutran,
      ngayTran: ngaytran, ngayMoHui: ngaymohui, ngayKetThuc: ngayketthuc, an, hoaHong, chuKyNgay,
      vonUngRa, kyHienTai: kytran+1, thamKeuKyNay: 0, lichSuLoi: [], daHot:false, ngayHot:null
    });
    saveTranDeal(state.tran.deals[state.tran.deals.length-1]);
    document.getElementById('tranFormPanel').classList.remove('open');
    renderTran();
  };

  document.querySelectorAll('#tranActiveList .detail-card, #tabTran .detail-card.closed').forEach(card=>{
    const id = card.dataset.id;
    const t = state.tran.deals.find(x=>x.id===id);
    if(!t) return;
    const tkInput = card.querySelector('[data-field="thamKeuKyNay"]');
    if(tkInput) tkInput.onchange = e=>{ t.thamKeuKyNay = Number(e.target.value)||0; saveTranDeal(t); };
    const hhInput = card.querySelector('[data-field="hoaHongKyNay"]');
    if(hhInput) hhInput.onchange = e=>{ t.hoaHongKyNay = Number(e.target.value)||0; saveTranDeal(t); };
    const tenInput = card.querySelector('[data-field="ten"]');
    if(tenInput) tenInput.onchange = e=>{ t.ten = e.target.value.trim() || t.ten; saveTranDeal(t); renderTran(); };
    const ntInput = card.querySelector('[data-field="ngayTran"]');
    if(ntInput) ntInput.onchange = e=>{ t.ngayTran = e.target.value; saveTranDeal(t); };
    const nmhInput = card.querySelector('[data-field="ngayMoHui"]');
    if(nmhInput) nmhInput.onchange = e=>{
      t.ngayMoHui = e.target.value;
      t.ngayKetThuc = addPeriods(t.ngayMoHui, t.loai, Math.max(t.tongSoKy - 1, 0), t.chuKyNgay);
      saveTranDeal(t); renderTran();
    };
    const ckInput = card.querySelector('[data-field="chuKyNgay"]');
    if(ckInput) ckInput.onchange = e=>{
      t.chuKyNgay = Number(e.target.value)||10;
      t.ngayKetThuc = addPeriods(t.ngayMoHui||t.ngayTran, t.loai, Math.max(t.tongSoKy - 1, 0), t.chuKyNgay);
      saveTranDeal(t); renderTran();
    };
    card.querySelectorAll('[data-action="unlock-info"]').forEach(b=>b.onclick=()=>{
      state.tranEditingInfo[t.id] = true; renderTran();
    });
    card.querySelectorAll('[data-action="lock-info"]').forEach(b=>b.onclick=()=>{
      const tenNow = card.querySelector('[data-field="ten"]');
      const ntNow = card.querySelector('[data-field="ngayTran"]');
      const nmhNow = card.querySelector('[data-field="ngayMoHui"]');
      const ckNow = card.querySelector('[data-field="chuKyNgay"]');
      if(tenNow && tenNow.value.trim()) t.ten = tenNow.value.trim();
      if(ntNow && ntNow.value) t.ngayTran = ntNow.value;
      if(nmhNow && nmhNow.value) t.ngayMoHui = nmhNow.value;
      if(ckNow && ckNow.value) t.chuKyNgay = Number(ckNow.value)||t.chuKyNgay;
      t.ngayKetThuc = addPeriods(t.ngayMoHui||t.ngayTran, t.loai, Math.max(t.tongSoKy - 1, 0), t.chuKyNgay);
      saveTranDeal(t);
      state.tranEditingInfo[t.id] = false; renderTran();
    });

    card.querySelectorAll('[data-edit-loi-ky]').forEach(inp=>{
      inp.onchange = (e) => {
        const ky = Number(inp.getAttribute('data-edit-loi-ky'));
        const v = Number(e.target.value)||0;
        if(v > t.menhGia){
          customAlert(`Thăm kêu (${fmt(v)}) không được lớn hơn số tiền mỗi kỳ (${fmt(t.menhGia)}).`);
          renderTran();
          return;
        }
        const entry = (t.lichSuLoi||[]).find(l=>l.ky===ky);
        if(entry){ entry.thamKeu = v; saveLoiHistoryRemote(entry, t.id); }
        renderTran();
      };
    });
    card.querySelectorAll('[data-edit-hoahong-ky]').forEach(inp=>{
      inp.onchange = (e) => {
        const ky = Number(inp.getAttribute('data-edit-hoahong-ky'));
        const v = Number(e.target.value)||0;
        const entry = (t.lichSuLoi||[]).find(l=>l.ky===ky);
        if(entry){ entry.hoaHong = v; saveLoiHistoryRemote(entry, t.id); }
        renderTran();
      };
    });
    card.querySelectorAll('[data-edit-ngay-ky]').forEach(inp=>{
      inp.onchange = (e) => {
        const ky = Number(inp.getAttribute('data-edit-ngay-ky'));
        const entry = (t.lichSuLoi||[]).find(l=>l.ky===ky);
        if(entry){ entry.ngay = e.target.value; saveLoiHistoryRemote(entry, t.id); }
        renderTran();
      };
    });
    card.querySelectorAll('[data-edit-note-ky]').forEach(inp=>{
      inp.onchange = (e) => {
        const ky = Number(inp.getAttribute('data-edit-note-ky'));
        const entry = (t.lichSuLoi||[]).find(l=>l.ky===ky);
        if(entry){ entry.note = e.target.value; saveLoiHistoryRemote(entry, t.id); }
      };
    });
    card.querySelectorAll('[data-undo-ky]').forEach(b=>b.onclick=()=>{
      const ky = Number(b.getAttribute('data-undo-ky'));
      customConfirm(`Quay lại nhập lại kỳ ${ky}? Số lời đã thu của kỳ này sẽ bị xoá, kỳ hiện tại sẽ lùi về kỳ ${ky}.`, () => {
        const removed = (t.lichSuLoi||[]).find(l=>l.ky===ky);
        t.lichSuLoi = (t.lichSuLoi||[]).filter(l=>l.ky!==ky);
        t.kyHienTai = ky;
        t.thamKeuKyNay = 0;
        t.hoaHongKyNay = 0;
        if(removed) deleteLoiHistoryRemote(removed.id);
        saveTranDeal(t); renderTran();
      });
    });
    card.querySelectorAll('[data-action="thuloi"]').forEach(b=>b.onclick=()=>{
      const daThuKyCuoi = t.kyHienTai>=t.tongSoKy && (t.lichSuLoi||[]).some(l=>l.ky===t.tongSoKy);
      if(daThuKyCuoi) return;
      const tk = t.thamKeuKyNay||0;
      if(tk > t.menhGia){
        customAlert(`Thăm kêu (${fmt(tk)}) không được lớn hơn số tiền mỗi kỳ (${fmt(t.menhGia)}).\n\nVui lòng nhập lại.`);
        return;
      }
      const hh = t.an ? (t.hoaHongKyNay||0) : 0;
      t.lichSuLoi = t.lichSuLoi||[];
      const newEntry = {id:uid(), ky:t.kyHienTai, thamKeu:tk, hoaHong:hh, ngay:todayISO()};
      t.lichSuLoi.push(newEntry);
      saveLoiHistoryRemote(newEntry, t.id);
      if(t.kyHienTai < t.tongSoKy) t.kyHienTai += 1;
      t.thamKeuKyNay = 0;
      t.hoaHongKyNay = 0;
      saveTranDeal(t); renderTran();
    });
    card.querySelectorAll('[data-action="hot"]').forEach(b=>b.onclick=()=>{
      const tongLoiDaThu = (t.lichSuLoi||[]).reduce((s,l)=>s+l.thamKeu,0);
      if(t.kyHienTai >= t.tongSoKy){
        // Giữ tới kỳ cuối: mệnh giá x tổng số kỳ + tổng lời đã thu (kỳ chót không có thăm kêu)
        const tongNhan = t.menhGia * t.tongSoKy + tongLoiDaThu;
        const laiRong = (tongNhan - t.vonUngRa) + tongLoiDaThu;
        customConfirm(`Giữ tới kỳ cuối. Số tiền thực nhận tính tự động = ${fmt(t.menhGia)} × ${t.tongSoKy} kỳ + lời đã thu ${fmt(tongLoiDaThu)} = ${fmt(tongNhan)}.\n\nXác nhận hốt với số tiền này?`, () => {
          t.daHot = true; t.ngayHot = todayISO(); t.tongNhanKhiHot = tongNhan; t.laiRongKhiHot = laiRong;
          t.songLucHot = t.tongSoKy - 1; t.chetLucHot = 1; t.kyHot = t.kyHienTai;
          saveTranDeal(t); renderTran();
        });
      } else {
        customHotGiuaChung(t, (r) => {
          t.daHot = true; t.ngayHot = todayISO();
          t.tongNhanKhiHot = r.tongNhan; t.laiRongKhiHot = r.laiRong;
          t.thamKeuKyHot = r.thamKeuKyHot; t.songLucHot = r.songLucHot; t.chetLucHot = r.chetLucHot;
          t.kyHot = t.kyHienTai;
          saveTranDeal(t); renderTran();
        });
      }
    });
    card.querySelectorAll('[data-action="xoa"]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      customConfirm(`Xoá vụ "${t.ten}"?`, () => {
        state.tran.deals = state.tran.deals.filter(x=>x.id!==id);
        deleteTranDealRemote(id); renderTran();
      });
    });
  });

  document.querySelectorAll('.tran-closed-row').forEach(row=>{
    row.onclick = () => { state.view='tranDetail'; state.tranDetailId = row.dataset.id; renderAll(); };
  });
}

/* ===================== STATS ===================== */
function overviewNumbers(){
  const active = state.dayList.filter(d=>!daKetThuc(d));
  const soDay = active.length;
  const soChan = active.reduce((s,d)=>s+(d.soChan||1),0);
  const chet = active.filter(d=>d.trangThai==='chet').reduce((s,d)=>s+(d.soChan||1),0);
  const song = active.filter(d=>d.trangThai==='song').reduce((s,d)=>s+(d.soChan||1),0);
  let huiSongDaDong = 0;
  active.filter(d=>d.trangThai==='song').forEach(d=>{
    huiSongDaDong += state.payments.filter(p=>p.dayId===d.id).reduce((s,p)=>s+p.soTien,0);
  });
  let huiChetCanTatToan = 0;
  active.filter(d=>d.trangThai==='chet').forEach(d=>{
    const konLai = Math.max(d.tongSoKy - d.kyHienTai + 1, 0);
    huiChetCanTatToan += konLai * d.menhGia * (d.soChan||1);
  });
  const canBang = huiSongDaDong - huiChetCanTatToan;
  const loiNhuan = state.payments.reduce((s,p)=>s+(p.loi||0),0);
  return { soDay, soChan, chet, song, huiSongDaDong, huiChetCanTatToan, canBang, loiNhuan };
}

function groupTableHTML(loaiKey, dayItems){
  if(dayItems.length===0) return '';
  const mk = monthKey(todayISO());
  let laiThangNhom = 0;
  dayItems.forEach(d=>{
    laiThangNhom += state.payments.filter(p=>p.dayId===d.id && monthKey(p.ngay)===mk).reduce((s,p)=>s+(p.loi||0),0);
  });
  const song = dayItems.filter(d=>d.trangThai==='song').reduce((s,d)=>s+(d.soChan||1),0);
  const chet = dayItems.filter(d=>d.trangThai==='chet').reduce((s,d)=>s+(d.soChan||1),0);

  let rows = dayItems.map((d,i)=>{
    const paid = daDongKyNay(d);
    const amount = tienDongChan(d);
    const ngayDong = calcNgayDong(d);
    return `<tr>
      <td>${i+1}</td>
      <td class="left">${d.ten}</td>
      <td>${fmt(d.menhGia)}</td>
      <td>${d.kyHienTai}/${d.tongSoKy}</td>
      <td>${ngayDong?formatDateVN(ngayDong):'—'}</td>
      <td>${d.trangThai==='song' ? fmt(-(d.boTham||0)) : '—'}</td>
      <td class="red">${d.trangThai==='chet' ? (d.soChan||1) : ''}</td>
      <td class="blue">${d.trangThai==='song' ? (d.soChan||1) : ''}</td>
      <td class="${paid?'green':'red'}">${fmt(amount)}</td>
    </tr>`;
  }).join('');

  const tongDong = dayItems.reduce((s,d)=>s+tienDongChan(d),0);

  return `
  <div class="stats-section">
    <h3>Hụi ${loaiLabel[loaiKey]}</h3>
    <div class="grp-meta">${dayItems.length} dây · Sống ${song} chân · Chết ${chet} chân · Lãi tháng này của nhóm: <b>${fmt(laiThangNhom)}</b></div>
    <div class="table-wrap">
      <table class="stat-table">
        <thead><tr><th>#</th><th>Dây hụi</th><th>Số tiền</th><th>Kỳ/Tổng</th><th>Ngày hốt</th><th>Bỏ thăm</th><th>Chết</th><th>Sống</th><th>Tiền đóng</th></tr></thead>
        <tbody>${rows}
          <tr class="total-row"><td colspan="8" class="left">CỘNG</td><td>${fmt(tongDong)}</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function tranStatsHTML(){
  if(state.tran.deals.length===0) return '';
  if(!state.tranStatsFilter) state.tranStatsFilter = currentMonthRange();
  const filter = state.tranStatsFilter;
  const inRange = (dateStr) => {
    if(!dateStr) return false;
    if(filter.from && dateStr < filter.from) return false;
    if(filter.to && dateStr > filter.to) return false;
    return true;
  };

  const visible = state.tran.deals.filter(t => !t.an);
  const hiddenAll = state.tran.deals.filter(t => t.an);

  // Lời/lãi ròng PHÁT SINH trong khoảng đã lọc cho từng vụ (không quan tâm ngày tràn của vụ đó)
  const rowsData = visible.map(t=>{
    const loiTrongKhoang = (t.lichSuLoi||[]).filter(l=>inRange(l.ngay)).reduce((s,l)=>s+l.thamKeu,0);
    const hotTrongKhoang = t.daHot && inRange(t.ngayHot);
    const laiRongTrongKhoang = hotTrongKhoang ? (t.laiRongKhiHot||0) : 0;
    return { t, loiTrongKhoang, hotTrongKhoang, laiRongTrongKhoang };
  }).filter(r => r.loiTrongKhoang !== 0 || r.hotTrongKhoang);

  rowsData.sort((a,b)=> (b.loiTrongKhoang+b.laiRongTrongKhoang) - (a.loiTrongKhoang+a.laiRongTrongKhoang));

  const rows = rowsData.map(({t, loiTrongKhoang, hotTrongKhoang, laiRongTrongKhoang})=>{
    return `<tr class="tran-stat-row" data-id="${t.id}" style="cursor:pointer;">
      <td class="left">${t.ten}${t.loai?` <span style="color:var(--ink-soft);font-size:10px;">(${loaiLabel[t.loai]})</span>`:''}${t.daHot?' <span style="color:var(--gold);font-size:10px;">(đã hốt)</span>':''}</td>
      <td>${t.kyHienTai}/${t.tongSoKy}</td>
      <td class="green">${fmt(loiTrongKhoang)}</td>
      <td class="${laiRongTrongKhoang>=0?'green':'red'}">${hotTrongKhoang ? fmt(laiRongTrongKhoang) : '—'}</td>
      <td>${fmt(loiTrongKhoang + laiRongTrongKhoang)}</td>
    </tr>`;
  }).join('');
  const tongLoiKhoang = rowsData.reduce((s,r)=>s+r.loiTrongKhoang,0);
  const tongLaiRongKhoang = rowsData.reduce((s,r)=>s+r.laiRongTrongKhoang,0);

  const byMonth = {};
  visible.forEach(t=>{
    if(t.daHot && inRange(t.ngayHot)){
      const mk = monthKey(t.ngayHot);
      byMonth[mk] = (byMonth[mk]||0) + (t.laiRongKhiHot||0);
    }
    (t.lichSuLoi||[]).forEach(l=>{
      if(!inRange(l.ngay)) return;
      const mk = monthKey(l.ngay);
      byMonth[mk] = (byMonth[mk]||0) + l.thamKeu;
    });
  });
  const months = Object.keys(byMonth).sort().reverse();
  const monthRows = months.map(mk=>`<tr><td class="left">${monthLabel(mk)}</td><td class="green">${fmt(byMonth[mk])}</td></tr>`).join('');
  const tongLoiTatCa = months.reduce((s,mk)=>s+byMonth[mk],0);

  const hoaHongByMonth = {};
  let tongHoaHong = 0;
  let soVuCoHoaHong = new Set();
  hiddenAll.forEach(t=>{
    (t.lichSuLoi||[]).forEach(l=>{
      if(l.hoaHong && inRange(l.ngay)){
        const mk = monthKey(l.ngay);
        hoaHongByMonth[mk] = (hoaHongByMonth[mk]||0) + l.hoaHong;
        tongHoaHong += l.hoaHong;
        soVuCoHoaHong.add(t.id);
      }
    });
  });
  const hoaHongMonths = Object.keys(hoaHongByMonth).sort().reverse();
  const hoaHongMonthRows = hoaHongMonths.map(mk=>`<tr><td class="left">${monthLabel(mk)}</td><td style="color:var(--heart);font-weight:700;">${fmt(hoaHongByMonth[mk])}</td></tr>`).join('');

  return `
  <div class="stats-section">
    <h3>Tràn hụi — lời phát sinh trong khoảng đã chọn</h3>
    <div class="field-row" style="margin-bottom:10px;">
      <div class="field"><label>Từ ngày</label><input type="date" id="tranFilterFrom" value="${filter.from||''}"></div>
      <div class="field"><label>Đến ngày</label><input type="date" id="tranFilterTo" value="${filter.to||''}"></div>
    </div>
    ${rowsData.length===0 ? `<div class="grp-meta">Không có vụ nào phát sinh lời trong khoảng ngày đã chọn.</div>` : `
    <div class="table-wrap"><table class="stat-table">
      <thead><tr><th>Vụ</th><th>Kỳ hiện tại</th><th>Lời trong khoảng</th><th>Lãi ròng (nếu hốt trong khoảng)</th><th>Tổng</th></tr></thead>
      <tbody>${rows}
        <tr class="total-row"><td colspan="2" class="left">TỔNG CỘNG</td><td class="green">${fmt(tongLoiKhoang)}</td><td class="green">${fmt(tongLaiRongKhoang)}</td><td>${fmt(tongLoiKhoang+tongLaiRongKhoang)}</td></tr>
      </tbody>
    </table></div>`}
    ${soVuCoHoaHong.size>0 ? `<div class="grp-meta" style="margin-top:8px;">${soVuCoHoaHong.size} vụ tràn hụi ẩn có phát sinh hoa hồng trong khoảng này (không hiện chi tiết ở đây — xem hoa hồng ở mục riêng bên dưới)</div>` : ''}
  </div>
  <div class="stats-section">
    <h3>Tràn hụi — Lời theo tháng (trong khoảng đã lọc ở trên)</h3>
    ${months.length===0 ? `<div class="grp-meta">Chưa có lời nào trong khoảng đã chọn.</div>` : `
    <div class="table-wrap"><table class="stat-table">
      <thead><tr><th>Tháng</th><th>Lời tràn hụi</th></tr></thead>
      <tbody>${monthRows}
        <tr class="total-row"><td class="left">TỔNG CỘNG</td><td class="green">${fmt(tongLoiTatCa)}</td></tr>
      </tbody>
    </table></div>`}
  </div>
  <div class="stats-section">
    <h3 style="border-color:var(--heart);">Tràn hụi ẩn — Hoa hồng theo tháng</h3>
    <div class="grp-meta">Khoản này <b>tách riêng, không cộng vào "Lời theo tháng"</b> ở trên — chỉ để xem cho biết. Chỉ tính hoa hồng phát sinh từ các lần "Thu lời" (giống hệt cách tính ở trang "Thu theo ngày"), không tính hoa hồng ban đầu lúc tạo vụ.</div>
    ${hoaHongMonths.length===0 ? `<div class="grp-meta">Chưa có hoa hồng nào trong khoảng đã chọn.</div>` : `
    <div class="table-wrap"><table class="stat-table">
      <thead><tr><th>Tháng</th><th>Hoa hồng</th></tr></thead>
      <tbody>${hoaHongMonthRows}
        <tr class="total-row"><td class="left">TỔNG CỘNG</td><td style="color:var(--heart);">${fmt(tongHoaHong)}</td></tr>
      </tbody>
    </table></div>`}
  </div>`;
}

function renderStats(){
  let html = tranStatsHTML();

  document.getElementById('tabStats').innerHTML = html;

  const ff = document.getElementById('tranFilterFrom');
  const ft = document.getElementById('tranFilterTo');
  if(ff) ff.onchange = (e) => { state.tranStatsFilter = state.tranStatsFilter||{}; state.tranStatsFilter.from = e.target.value; renderStats(); };
  if(ft) ft.onchange = (e) => { state.tranStatsFilter = state.tranStatsFilter||{}; state.tranStatsFilter.to = e.target.value; renderStats(); };
  document.querySelectorAll('.tran-stat-row').forEach(row=>{
    row.onclick = () => { state.view='tranDetail'; state.tranDetailId = row.dataset.id; renderAll(); };
  });
}

/* ===================== AUTH GATE ===================== */
function showAuthGate(){
  document.getElementById('authGate').style.display = 'block';
  document.getElementById('appRoot').style.display = 'none';
}
function showApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
}
function showAuthError(msg){
  const box = document.getElementById('authError');
  box.textContent = msg;
  box.style.display = 'block';
}
async function doLogin(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  document.getElementById('authError').style.display = 'none';
  if(!email || !password){ showAuthError('Vui lòng nhập đủ email và mật khẩu.'); return; }
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if(error){ showAuthError('Đăng nhập thất bại: ' + error.message); return; }
  // onAuthStateChange bên dưới sẽ tự showApp() + loadData()
}
document.getElementById('authLoginBtn').onclick = doLogin;
document.getElementById('auth_password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('authLogoutBtn').onclick = async () => {
  await supa.auth.signOut();
};

supa.auth.onAuthStateChange((event, session) => {
  if(session){
    showApp();
    if(!loaded) loadData();
  } else {
    showAuthGate();
  }
});

/* ===================== GHI CHÚ (sidebar) ===================== */
function renderGhiChu(){
  const list = document.getElementById('ghiChuList');
  if(!list) return;
  const notes = (state.ghiChu.notes||[]).slice().sort((a,b)=> (b.updatedAt||b.ngay||'').localeCompare(a.updatedAt||a.ngay||''));
  if(notes.length===0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);padding:6px 0;">Chưa có ghi chú nào. Bấm "+ Ghi chú mới" để bắt đầu.</div>`;
  } else {
    list.innerHTML = notes.map(n=>{
      const expanded = !!state.ghiChuExpanded[n.id];
      const firstLine = (n.noiDung||'').split('\n')[0];
      const preview = firstLine.slice(0,36) || '(ghi chú trống)';
      return `<div class="note-item">
        <div class="note-toggle" data-id="${n.id}">
          <span class="preview">${preview}${firstLine.length>36?'…':''}</span>
          <span class="arrow">${expanded?'▼':'▸'}</span>
        </div>
        ${expanded ? `
          <textarea data-ghichu-content="${n.id}" placeholder="Viết ghi chú...">${n.noiDung||''}</textarea>
          <div class="note-foot">
            <span class="note-date">${formatDateVN(n.ngay)}</span>
            <span style="display:flex;gap:6px;">
              <button class="note-icon-btn" data-save-ghichu="${n.id}" title="Lưu">💾</button>
              <button class="note-icon-btn" data-del-ghichu="${n.id}" title="Xoá">🗑</button>
            </span>
          </div>` : ''}
      </div>`;
    }).join('');
  }
  list.querySelectorAll('.note-toggle').forEach(el=>{
    el.onclick = () => { const id=el.dataset.id; state.ghiChuExpanded[id]=!state.ghiChuExpanded[id]; renderGhiChu(); };
  });
  list.querySelectorAll('[data-save-ghichu]').forEach(b=>{
    b.onclick = () => {
      const id = b.getAttribute('data-save-ghichu');
      const ta = list.querySelector(`[data-ghichu-content="${id}"]`);
      const note = state.ghiChu.notes.find(n=>n.id===id);
      if(note && ta){ note.noiDung = ta.value; note.updatedAt = new Date().toISOString(); saveGhiChu(note); renderGhiChu(); }
    };
  });
  list.querySelectorAll('[data-del-ghichu]').forEach(b=>{
    b.onclick = () => {
      const id = b.getAttribute('data-del-ghichu');
      customConfirm('Xoá ghi chú này?', () => {
        state.ghiChu.notes = state.ghiChu.notes.filter(n=>n.id!==id);
        deleteGhiChuRemote(id);
        renderGhiChu();
      });
    };
  });
}
const addGhiChuBtnEl = document.getElementById('addGhiChuBtn');
if(addGhiChuBtnEl) addGhiChuBtnEl.onclick = () => {
  const note = { id: uid(), noiDung:'', ngay: todayISO(), updatedAt: new Date().toISOString() };
  state.ghiChu.notes.push(note);
  state.ghiChuExpanded[note.id] = true;
  saveGhiChu(note);
  renderGhiChu();
};

/* ===================== INIT ===================== */
(async () => {
  const { data: { session } } = await supa.auth.getSession();
  if(session){ showApp(); loadData(); }
  else { showAuthGate(); }
})();
</script>
</body>
</html>
